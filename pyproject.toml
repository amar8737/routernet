[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "routernet"
version = "0.1.4"
description = "Per-sample specialist routing ensemble with learned context awareness"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Amar Jeet Kushwaha" },
]
keywords = [
  "ensemble", "routing", "mixture-of-experts", "context-aware",
  "machine-learning", "classification", "regression",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Strong gradient-boosting specialist pool (used when strings 'cat'/'xgb' are requested)
boost = [
  "xgboost>=1.7",
  "lightgbm>=3.3",
  "catboost>=1.1",
]
# Development
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "build>=1.0",
  "twine>=4",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/amar8737/routernet"
Repository = "https://github.com/amar8737/routernet"

[tool.hatch.build.targets.wheel]
packages = ["src/routernet"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/routernet",
  "tests",
  "pyproject.toml",
  "README.md",
  "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -q"
filterwarnings = [
  "ignore::UserWarning",
  "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
